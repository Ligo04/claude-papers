[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mjfit"
description = "Exact convex collision geometry for MuJoCo assemblies: pegs and holes, threads, and gears."
readme = "README.md"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Younghyo Park", email = "younghyo@mit.edu" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "mujoco>=3.3",
    "mapbox_earcut>=1.0",
    "pyyaml>=6.0",
]
keywords = ["mujoco", "robotics", "simulation", "collision", "peg-in-hole", "assembly"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = ["pytest>=7", "scipy>=1.10"]
benchmark = [
    "coacd>=1.0",
    "vhacdx>=0.1",
    "trimesh>=4.0",
    "manifold3d>=2.5",
    "shapely>=2.0",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tqdm>=4.0",
    "tabulate>=0.9",
    "scikit-image>=0.22",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
mjfit = "mjfit.cli:main"

[project.urls]
Homepage = "https://github.com/younghyopark/mjfit"
Issues = "https://github.com/younghyopark/mjfit/issues"
Paper = "https://arxiv.org/abs/2610.23849"

[tool.hatch.version]
path = "src/mjfit/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/mjfit", "README.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "preserve"
