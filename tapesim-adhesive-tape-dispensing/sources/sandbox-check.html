en]{display:none}.sheet{background:var(--paper);border:1px solid var(--line);padding:27px;border-radius:13px;margin:20px 0}.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,1fr);gap:28px}.note{border-left:3px solid var(--orange);padding:9px 14px;background:#f8f0dd;font-size:14px;margin:18px 0}.muted{color:var(--muted)}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:14px 0}.controls label{display:flex;gap:8px;align-items:center;font-size:14px}.controls select{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px}.range{width:100%;accent-color:var(--blue)}svg{width:100%;height:auto;display:block}svg text{font-family:inherit;fill:var(--ink)}.legend{display:flex;gap:19px;flex-wrap:wrap;font-size:13px}.legend span:before{content:&quot;&quot;;display:inline-block;width:10px;height:10px;background:var(--c);margin-right:6px;border-radius:2px}.formula{font-family:ui-monospace,monospace;font-size:14px;overflow:auto;padding:13px;background:#eaf0ed;border-radius:7px}.steps{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}.steps button{font-size:13px;flex:1;min-width:110px}.reading{max-width:800px}.reading p{margin:10px 0}.bars{margin-top:18px}.barrow{display:grid;grid-template-columns:76px 1fr 92px;align-items:center;gap:12px;font:14px/1.5 ui-monospace,monospace;margin:12px 0}.track{height:25px;border-radius:4px;background:#e8eeeb;overflow:hidden}.fill{height:100%;background:var(--blue);border-radius:4px;transition:width .22s ease;min-width:0}.barrow.chosen{font-weight:750}.barrow.chosen .track{outline:2px solid var(--ink);outline-offset:3px}.value{text-align:right}.twostats{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:22px 0}.twostats&gt;div{border-top:1px solid var(--line);padding-top:8px}.twostats .number{font:30px/1.4 ui-monospace,monospace}.matrix{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.cell{padding:15px;border-radius:8px;background:#e3eee8}.cell.bad{background:#f4e5da}.cell strong{font:35px/1.3 ui-monospace,monospace;display:block}.cell small{display:block;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:14px;margin:18px 0}th,td{border-bottom:1px solid var(--line);text-align:left;padding:10px 7px;vertical-align:top}th{font-weight:650}.table-scroll{overflow:auto}details{border-top:1px solid var(--line);padding:15px 0}summary{cursor:pointer;font-weight:600}details p{font-size:14px}.badge{font:12px/1.4 ui-monospace,monospace;padding:4px 8px;border:1px solid var(--line);border-radius:6px;display:inline-block}.footer{margin-top:38px;border-top:1px solid var(--line);padding-top:18px;font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:20px;align-items:baseline}.screenreader{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.fit-note{font-size:14px;min-height:3em}.plot-note{font-size:13px;color:var(--muted);margin:14px 0}.rule{border-top:1px solid var(--line);padding-top:18px;margin-top:22px}output{font:14px/1.5 ui-monospace,monospace}@media(max-width:720px){main{padding:22px 17px 50px}.hero{padding-top:30px}.grid{grid-template-columns:1fr}.sheet{padding:19px}.hero-metrics{gap:12px}.big{font-size:26px}.barrow{grid-template-columns:70px 1fr 78px;gap:7px;font-size:12px}.mast{font-size:10px}.nav{gap:5px}.nav button{font-size:12px;padding:7px 8px}h2{font-size:24px}.steps button{flex:auto}.caption{font-size:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

&lt;body&gt;
&lt;main&gt;
&lt;div class=&quot;mast&quot;&gt;&lt;span&gt;PHYSICS STUDY / TAPESIM&lt;/span&gt;&lt;a href=&quot;https://arxiv.org/abs/2609.28766v2&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;arXiv 2609.28766v2 ↗&lt;/a&gt;&lt;/div&gt;
&lt;header class=&quot;hero&quot;&gt;
&lt;div class=&quot;eyebrow&quot;&gt;机器人操作 · 接触仿真 · 释放前沿降阶&lt;/div&gt;
&lt;h1&gt;TapeSim&lt;span&gt;把变形留在放带前沿&lt;/span&gt;&lt;/h1&gt;
&lt;p class=&quot;intro&quot;&gt;卷内材料一起运动，前沿附近需要弯曲，放出的胶带继续保持柔性。沿着这条材料边界，理解自由度、黏附历史与数值求解的取舍。&lt;/p&gt;
&lt;div class=&quot;hero-metrics&quot;&gt;&lt;div&gt;&lt;div class=&quot;big&quot;&gt;3.2–3.4×&lt;/div&gt;&lt;div class=&quot;caption&quot;&gt;32 圈 · 固定容差物理步加速&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;big&quot;&gt;4.5–8.4×&lt;/div&gt;&lt;div class=&quot;caption&quot;&gt;32 圈 · 可比卷筒运动加速&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;big&quot;&gt;0.422×&lt;/div&gt;&lt;div class=&quot;caption&quot;&gt;RTX 5090 · 封箱演示实时倍速&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/header&gt;
&lt;nav class=&quot;nav&quot; aria-label=&quot;学习章节&quot; role=&quot;tablist&quot;&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;mechanism&quot; id=&quot;tab-mechanism&quot; data-panel=&quot;mechanism&quot;&gt;01 材料怎样释放&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;experiments&quot; id=&quot;tab-experiments&quot; data-panel=&quot;experiments&quot;&gt;02 实验怎样比较&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;prediction&quot; id=&quot;tab-prediction&quot; data-panel=&quot;prediction&quot;&gt;03 能预测同一案例吗&lt;/button&gt;
&lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;limits&quot; id=&quot;tab-limits&quot; data-panel=&quot;limits&quot;&gt;04 验证与边界&lt;/button&gt;
&lt;/nav&gt;

&lt;section id=&quot;mechanism&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;tab-mechanism&quot;&gt;
&lt;div class=&quot;row&quot;&gt;&lt;h2&gt;一条胶带，三种计算区域&lt;/h2&gt;&lt;span class=&quot;badge&quot;&gt;论文 III-C&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;grid sheet&quot;&gt;
&lt;div&gt;
&lt;svg id=&quot;roll-diagram&quot; viewBox=&quot;0 0 620 325&quot; role=&quot;img&quot; aria-label=&quot;刚体卷内主体、可变形 collar 与自由胶带的示意图&quot;&gt;&lt;/svg&gt;
&lt;label for=&quot;payout&quot;&gt;推进释放前沿 &lt;output id=&quot;payout-value&quot;&gt;&lt;/output&gt;&lt;/label&gt;
&lt;input class=&quot;range&quot; id=&quot;payout&quot; aria-label=&quot;释放进度示意&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;28&quot; value=&quot;6&quot;&gt;
&lt;div class=&quot;legend&quot;&gt;&lt;span style=&quot;--c:var(--orange)&quot;&gt;cluster&lt;/span&gt;&lt;span style=&quot;--c:var(--pink)&quot;&gt;collar&lt;/span&gt;&lt;span style=&quot;--c:var(--blue)&quot;&gt;自由薄壳&lt;/span&gt;&lt;/div&gt;
&lt;p class=&quot;caption&quot;&gt;示意材料行，不对应真实时间、放带长度或运动预测。collar 的论文配置为 10 条图边。&lt;/p&gt;
&lt;/div&gt;
&lt;div&gt;
&lt;h3&gt;边界移动，材料保持连续&lt;/h3&gt;
&lt;p&gt;cluster 共享 6 个平移与旋转自由度。已释放材料一直是薄壳，可再黏到新目标上。&lt;/p&gt;
&lt;p id=&quot;front-explanation&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;div class=&quot;formula&quot;&gt;F&lt;sub&gt;k&lt;/sub&gt; ⊆ F&lt;sub&gt;k+1&lt;/sub&gt;&lt;br&gt;C&lt;sub&gt;k+1&lt;/sub&gt; ⊆ C&lt;sub&gt;k&lt;/sub&gt;&lt;/div&gt;
&lt;p class=&quot;caption&quot;&gt;恢复薄壳时保留原 rest shape、黏附历史，并继承刚体速度 v + ω × r。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;一次时间步里，何时改状态？&lt;/h3&gt;
&lt;div class=&quot;steps&quot; aria-label=&quot;时间步阶段&quot;&gt;&lt;button aria-pressed=&quot;true&quot; data-step=&quot;0&quot;&gt;运动求解&lt;/button&gt;&lt;button aria-pressed=&quot;false&quot; data-step=&quot;1&quot;&gt;更新界面&lt;/button&gt;&lt;button aria-pressed=&quot;false&quot; data-step=&quot;2&quot;&gt;检测前沿&lt;/button&gt;&lt;button aria-pressed=&quot;false&quot; data-step=&quot;3&quot;&gt;补充 collar&lt;/button&gt;&lt;button aria-pressed=&quot;false&quot; data-step=&quot;4&quot;&gt;可选切割&lt;/button&gt;&lt;/div&gt;
&lt;p class=&quot;fit-note&quot; id=&quot;step-explanation&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;div class=&quot;sheet grid&quot;&gt;
&lt;div&gt;
&lt;h2&gt;同一对接触，可选两种界面&lt;/h2&gt;
&lt;div class=&quot;controls&quot; aria-label=&quot;界面模型&quot;&gt;&lt;button data-interface=&quot;Coh&quot; aria-pressed=&quot;false&quot;&gt;Cohesive&lt;/button&gt;&lt;button data-interface=&quot;Bond&quot; aria-pressed=&quot;true&quot;&gt;Releasable bond&lt;/button&gt;&lt;/div&gt;
&lt;div id=&quot;interface-explanation&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;formula&quot; id=&quot;interface-formula&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;caption&quot;&gt;Bond 复用四个现有顶点。ABD-type 描述能量形式，cluster 仍为 6 DOF。&lt;/p&gt;
&lt;/div&gt;
&lt;div&gt;
&lt;svg id=&quot;bond-diagram&quot; viewBox=&quot;0 0 350 195&quot; role=&quot;img&quot; aria-label=&quot;界面在压缩、参考态和张开时的形状示意&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;controls&quot; aria-label=&quot;界面加载状态&quot;&gt;&lt;button data-load=&quot;compression&quot; aria-pressed=&quot;false&quot;&gt;压缩&lt;/button&gt;&lt;button data-load=&quot;rest&quot; aria-pressed=&quot;true&quot;&gt;参考态&lt;/button&gt;&lt;button data-load=&quot;opening&quot; aria-pressed=&quot;false&quot;&gt;张开至超过阈值&lt;/button&gt;&lt;/div&gt;
&lt;p id=&quot;load-explanation&quot; class=&quot;fit-note&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;caption&quot;&gt;只示意判据，没有模拟力或材料响应。压缩本身不触发文中的拉伸断裂。&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;table-scroll&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;全薄壳 F&lt;/th&gt;&lt;th&gt;cluster + collar R&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;th&gt;Cohesive 界面&lt;/th&gt;&lt;td&gt;Coh-F&lt;/td&gt;&lt;td&gt;Coh-R&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th&gt;Bond 界面&lt;/th&gt;&lt;td&gt;Bond-F&lt;/td&gt;&lt;td&gt;Bond-R&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;experiments&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;tab-experiments&quot; hidden&gt;
&lt;div class=&quot;row&quot;&gt;&lt;h2&gt;先对齐运动，再读加速比&lt;/h2&gt;&lt;span class=&quot;badge&quot;&gt;论文 IV-B&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;sheet&quot;&gt;
&lt;div class=&quot;controls&quot;&gt;&lt;label&gt;比较口径 &lt;select id=&quot;protocol&quot;&gt;&lt;option value=&quot;matched&quot;&gt;可比卷筒运动&lt;/option&gt;&lt;option value=&quot;fixed&quot;&gt;固定 Newton 容差&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;卷绕圈数 &lt;select id=&quot;turns&quot;&gt;&lt;option value=&quot;2&quot;&gt;2 圈&lt;/option&gt;&lt;option value=&quot;8&quot;&gt;8 圈&lt;/option&gt;&lt;option value=&quot;16&quot;&gt;16 圈&lt;/option&gt;&lt;option value=&quot;32&quot; selected&gt;32 圈&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;
&lt;p id=&quot;cost-protocol&quot; class=&quot;fit-note&quot;&gt;&lt;/p&gt;
&lt;div id=&quot;cost-bars&quot; class=&quot;bars&quot; aria-label=&quot;四种配置的物理步成本&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;twostats&quot;&gt;&lt;div&gt;&lt;div id=&quot;coh-speed&quot; class=&quot;number&quot;&gt;&lt;/div&gt;&lt;div class=&quot;caption&quot;&gt;Coh-F → Coh-R&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div id=&quot;bond-speed&quot; class=&quot;number&quot;&gt;&lt;/div&gt;&lt;div class=&quot;caption&quot;&gt;Bond-F → Bond-R&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;note&quot;&gt;RTX PRO 6000 Blackwell Server Edition。物理步计时排除前沿更新、控制、遥测和渲染；作者未提供这里各柱的重复级误差条。&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;为什么同一容差不等于同一精度？&lt;/summary&gt;&lt;p&gt;32 圈 Coh-F 仅把容差从 10⁻² 收紧到 10⁻³ m/s，角度范围就从 9.7° 增至 38.1°。可比运动实验以 Bond-R 在 10⁻² m/s 下的角度范围为目标，各模型选择不同容差，使范围差不超过 5%。这只匹配该运动指标，不能保证全部接触行为相同。&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;div class=&quot;sheet&quot;&gt;
&lt;h2&gt;开环回放：平均改善不等于每段都更好&lt;/h2&gt;
&lt;div class=&quot;controls&quot;&gt;&lt;label&gt;Stick episode &lt;select id=&quot;replay-episode&quot;&gt;&lt;option value=&quot;mean&quot;&gt;五段等权平均&lt;/option&gt;&lt;option value=&quot;stick_tape_on_stand__017&quot;&gt;17&lt;/option&gt;&lt;option value=&quot;stick_tape_on_stand__018&quot;&gt;18&lt;/option&gt;&lt;option value=&quot;stick_tape_on_stand__019&quot;&gt;19&lt;/option&gt;&lt;option value=&quot;stick_tape_on_stand__023&quot;&gt;23&lt;/option&gt;&lt;option value=&quot;stick_tape_on_stand__025&quot;&gt;25&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;
&lt;div id=&quot;replay-bars&quot; aria-label=&quot;图像平面卷芯 landmark 平均误差&quot;&gt;&lt;/div&gt;
&lt;p id=&quot;replay-explanation&quot; class=&quot;fit-note&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;plot-note&quot;&gt;848 × 480 ego-camera 图像；排除开头静止的 3 秒；每模型两次重复先在 episode 内平均，再对五段等权平均。单段数字来自作者网页统计，不能解释为 3D 全状态误差。&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;sheet&quot;&gt;
&lt;h2&gt;独立力学标定，避免只追成功率&lt;/h2&gt;
&lt;p&gt;实测剥离力 2.5 N；C&lt;sub&gt;n&lt;/sub&gt; = C&lt;sub&gt;t&lt;/sub&gt; = 0.675 N 时仿真反力中位数 2.54 N。&lt;/p&gt;
&lt;div class=&quot;controls&quot;&gt;&lt;label&gt;桌面 C&lt;sub&gt;n&lt;/sub&gt; 倍率 &lt;select id=&quot;adhesion&quot;&gt;&lt;option value=&quot;0&quot;&gt;1× · 标定值&lt;/option&gt;&lt;option value=&quot;1&quot;&gt;20×&lt;/option&gt;&lt;option value=&quot;2&quot;&gt;100×&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;
&lt;div id=&quot;adhesion-bars&quot; aria-label=&quot;98 个 Peel 案例的仿真成功率&quot;&gt;&lt;/div&gt;
&lt;p id=&quot;adhesion-explanation&quot; class=&quot;fit-note&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;caption&quot;&gt;论文 Fig.7，同一组 98 案例，真实成功 68/98 = 69.4%。与 100 例的主 Peel 评估分开。图中百分比按论文保留一位小数。&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;prediction&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;tab-prediction&quot; hidden&gt;
&lt;div class=&quot;row&quot;&gt;&lt;h2&gt;成功的数量相同，成员也相同吗？&lt;/h2&gt;&lt;span class=&quot;badge&quot;&gt;论文 IV-D&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;controls&quot;&gt;&lt;label&gt;任务 &lt;select id=&quot;task&quot;&gt;&lt;option value=&quot;Peel&quot;&gt;Peel&lt;/option&gt;&lt;option value=&quot;Stick&quot; selected&gt;Stick&lt;/option&gt;&lt;option value=&quot;Wrap1&quot;&gt;Wrap ≥1 圈&lt;/option&gt;&lt;option value=&quot;Wrap2&quot;&gt;Wrap ≥2 圈&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;查看配置 &lt;select id=&quot;model&quot;&gt;&lt;option&gt;Coh-F&lt;/option&gt;&lt;option&gt;Coh-R&lt;/option&gt;&lt;option&gt;Bond-F&lt;/option&gt;&lt;option selected&gt;Bond-R&lt;/option&gt;&lt;option value=&quot;fail&quot;&gt;恒定预测失败&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;
&lt;p id=&quot;task-context&quot;&gt;&lt;/p&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;sheet&quot;&gt;
&lt;div class=&quot;controls&quot; aria-label=&quot;预测评估指标&quot;&gt;&lt;button data-metric=&quot;sim&quot; aria-pressed=&quot;true&quot;&gt;仿真成功率&lt;/button&gt;&lt;button data-metric=&quot;agreement&quot; aria-pressed=&quot;false&quot;&gt;逐例一致率&lt;/button&gt;&lt;button data-metric=&quot;ba&quot; aria-pressed=&quot;false&quot;&gt;Balanced accuracy&lt;/button&gt;&lt;/div&gt;
&lt;div id=&quot;prediction-bars&quot; aria-label=&quot;各配置与全失败基线的指标&quot;&gt;&lt;/div&gt;
&lt;p id=&quot;metric-explanation&quot; class=&quot;fit-note&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;sheet&quot;&gt;
&lt;h3 id=&quot;matrix-title&quot;&gt;&lt;/h3&gt;
&lt;div class=&quot;matrix&quot; id=&quot;matrix&quot; aria-label=&quot;真实与仿真的逐例混淆矩阵&quot;&gt;&lt;/div&gt;
&lt;p id=&quot;matrix-result&quot; class=&quot;fit-note&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div id=&quot;prediction-warning&quot; class=&quot;note&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;三个指标分别回答什么？&lt;/summary&gt;&lt;p&gt;仿真成功率 = (TP + FP) / n，只看模拟器有多少成功。Agreement = (TP + TN) / n，检查是否预测同一案例。BA = ½[TP/(TP+FN) + TN/(TN+FP)]，给予真实成功和失败同等权重。恒定预测在两个类别都存在时 BA 为 50%。&lt;/p&gt;&lt;p&gt;TP：两域都成功；TN：两域都失败；FP：仿真成功、真实失败；FN：真实成功、仿真失败。两种 Wrap 阈值使用同一批 55 个案例，不能当成 110 个独立案例。&lt;/p&gt;&lt;/details&gt;
&lt;/section&gt;

&lt;section id=&quot;limits&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;tab-limits&quot; hidden&gt;
&lt;h2&gt;哪些结论可以带走&lt;/h2&gt;
&lt;div class=&quot;grid&quot;&gt;
&lt;div class=&quot;sheet reading&quot;&gt;&lt;h3&gt;对仿真器设计的启发&lt;/h3&gt;&lt;p&gt;先确认哪些材料需要独立变形，再减少内部冗余求解。cluster 与 bond 应作为两个独立选择比较。&lt;/p&gt;&lt;p&gt;前沿更新涉及质量、速度、rest shape 和界面历史。只把顶点从“刚体”改成“软体”标签不足以实现连续放带。&lt;/p&gt;&lt;p&gt;旋转坐标的完整 Hessian 有额外链式项；刚体上的点走弧线，CCD 也需要适配。&lt;/p&gt;&lt;div class=&quot;formula&quot;&gt;v&lt;sub&gt;i&lt;/sub&gt; = v&lt;sub&gt;p&lt;/sub&gt; + ω&lt;sub&gt;p&lt;/sub&gt; × (x&lt;sub&gt;i&lt;/sub&gt; − c&lt;sub&gt;p&lt;/sub&gt;)&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;sheet reading&quot;&gt;&lt;h3&gt;结论的适用范围&lt;/h3&gt;&lt;p&gt;可比运动只约束特定摆动测试。五段回放量测二维 landmark。冻结策略使用内部 VLA，真实与仿真的初态手动配准。&lt;/p&gt;&lt;p&gt;前沿单向推进，已放出的材料不重新入卷。对重新卷绕、卷内滑移或挤压卷筒，需重新检查假设。&lt;/p&gt;&lt;p&gt;Bond 的任务排名会变。Wrap 中 Coh-R 更好，不能只因 Bond-R 在部分成本指标领先就统一替换全部界面。&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;sheet&quot;&gt;
&lt;h3&gt;实测量与配置值分开读&lt;/h3&gt;
&lt;div class=&quot;table-scroll&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;量&lt;/th&gt;&lt;th&gt;值&lt;/th&gt;&lt;th&gt;来源性质&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;宽 / 全厚度&lt;/td&gt;&lt;td&gt;19 / 0.18 mm&lt;/td&gt;&lt;td&gt;实测&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;密度&lt;/td&gt;&lt;td&gt;1300 kg/m³&lt;/td&gt;&lt;td&gt;实测&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;膜 / 弯曲 E&lt;/td&gt;&lt;td&gt;50 / 50 MPa&lt;/td&gt;&lt;td&gt;配置&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;泊松比&lt;/td&gt;&lt;td&gt;0.45&lt;/td&gt;&lt;td&gt;配置&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;单位长度质量&lt;/td&gt;&lt;td&gt;4.446 g/m&lt;/td&gt;&lt;td&gt;由尺寸与密度计算&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;collar&lt;/td&gt;&lt;td&gt;N = 10 图边&lt;/td&gt;&lt;td&gt;配置，物理宽度依赖网格&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;摆动 bond 参数&lt;/td&gt;&lt;td&gt;κ = 10⁶ Pa；f_break = 0.5 N&lt;/td&gt;&lt;td&gt;该实验配置&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;sheet reading&quot;&gt;&lt;h3&gt;本地教学验证&lt;/h3&gt;&lt;p id=&quot;demo-status&quot;&gt;&lt;/p&gt;&lt;p&gt;教学程序使用 NumPy，验证 bond 解析梯度与独立有限差分、刚体变换不变性、力的旋转协变、压缩释放门槛，以及前沿旧状态快照、质量分类和刚体速度恢复。&lt;/p&gt;&lt;p&gt;没有实现薄壳运动、IPC/CCD、Newton-PCG、真实放带、切割、GPU 计时或机器人。它不构成论文实验复现。&lt;/p&gt;&lt;details&gt;&lt;summary&gt;一个势能能保证什么？&lt;/summary&gt;&lt;p&gt;||FFᵀ − I||² 在任何正交 F 下都为零，包括反射。教学程序会验证这个数学边界。不能由此断言作者系统实际发生了翻转，也不能把这个单项势能当成完整不穿透证明。&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;
